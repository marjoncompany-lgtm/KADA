<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KADA 5.0mins | 300-Second AI Cinema Studio</title>

  <meta name="theme-color" content="#05070b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            cine: {
              void: '#04060a',
              card: '#090d15',
              surface: '#101624',
              border: 'rgba(255, 255, 255, 0.08)',
              cyan: '#00e5ff',
              amber: '#ffaa00',
              emerald: '#10b981'
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-cine-void text-zinc-100 font-sans h-screen flex flex-col overflow-hidden antialiased select-none">

  <!-- TOP HEADER -->
  <header class="h-14 border-b border-cine-border bg-cine-card/90 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 via-indigo-600 to-amber-500 flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/20">
        <i data-lucide="clapperboard" class="w-4 h-4 text-white"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-extrabold tracking-wide text-sm bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-white to-amber-300">
          KADA 5.0mins
        </span>
        <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-800 font-semibold tracking-wider">
          300s CINEMA MASTER
        </span>
      </div>
    </div>

    <button onclick="location.reload()" class="p-2 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-white transition-all" title="New Production">
      <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
    </button>
  </header>

  <!-- CHAT STREAM -->
  <main id="chatStream" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-4xl w-full mx-auto">
    
    <div class="flex gap-3">
      <div class="w-8 h-8 rounded-full bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shrink-0 mt-1">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
      </div>
      <div class="space-y-3 max-w-2xl">
        <div class="bg-cine-card border border-cine-border p-4 rounded-2xl rounded-tl-sm text-sm text-zinc-200 leading-relaxed shadow-xl">
          <p class="font-bold text-white mb-1">KADA 5.0mins Production Pipeline</p>
          <p class="text-zinc-300 text-xs leading-relaxed">
            Generates 5 sequential acts (300s total). The complete video only displays once all 5 scenes are verified and fully rendered.
          </p>
        </div>

        <div class="flex flex-wrap gap-2 text-xs">
          <button onclick="setPrompt('Elijah, a young boy from a modest neighborhood in Bataan, follows his dream of singing at a local festival to global stardom')" class="px-3 py-1.5 rounded-xl bg-cine-surface border border-cine-border hover:border-cyan-400 text-zinc-300 transition-all">
            🇵🇭 Elijah: From Bataan to Stardom
          </button>
          <button onclick="setPrompt('Blade Runner cyberpunk city in pouring rain with neon reflections and flying spinner cars')" class="px-3 py-1.5 rounded-xl bg-cine-surface border border-cine-border hover:border-cyan-400 text-zinc-300 transition-all">
            🌆 Cyberpunk Metropolis
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- PROMPT BAR -->
  <footer class="p-4 border-t border-cine-border bg-cine-card/95 backdrop-blur-md shrink-0">
    <div class="max-w-4xl mx-auto space-y-2">
      <form id="promptForm" onsubmit="handleStartProduction(event)" class="relative flex items-center gap-2">
        <input type="text" id="promptInput" placeholder="Enter script or prompt..." autocomplete="off" class="flex-1 bg-cine-surface border border-cine-border text-sm text-white placeholder-zinc-500 rounded-xl px-4 py-3.5 focus:outline-none focus:border-cyan-400 transition-all">
        
        <button type="submit" id="generateBtn" class="px-6 py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-extrabold text-xs flex items-center gap-2 transition-all shadow-lg shadow-cyan-500/25">
          <span>Generate 300s Film</span>
          <i data-lucide="play" class="w-4 h-4 fill-current"></i>
        </button>
      </form>
      <div class="flex items-center justify-between text-[10px] font-mono text-zinc-500 px-1">
        <span>Full 300s Verification Engine</span>
        <span id="systemStatus">Ready</span>
      </div>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    function setPrompt(text) {
      document.getElementById('promptInput').value = text;
      document.getElementById('promptForm').dispatchEvent(new Event('submit'));
    }

    async function handleStartProduction(e) {
      e.preventDefault();
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      appendUserChat(text);

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      const prodId = 'prod-' + Date.now();
      appendLoadingCard(prodId);

      const cleanText = text.replace(/[#*_`]/g, '').trim();
      const script = build5ActScript(cleanText);

      // Fetch all images and guarantee 100% completion before revealing video
      const sceneImages = await fetchAllSceneImagesGuaranteed(script, prodId);

      // Render the player only after all images exist and are verified
      renderCinemaPlayer(prodId, script, sceneImages);

      btn.disabled = false;
      btn.classList.remove('opacity-50');
      document.getElementById('systemStatus').textContent = 'Completed';
    }

    function appendUserChat(text) {
      const stream = document.getElementById('chatStream');
      const div = document.createElement('div');
      div.className = 'flex justify-end gap-3';
      div.innerHTML = `
        <div class="max-w-xl bg-cyan-600 text-white p-3.5 px-4 rounded-2xl rounded-tr-sm text-sm shadow-md">
          <p class="leading-relaxed">${escapeHtml(text)}</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-bold shrink-0">U</div>
      `;
      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight;
    }

    function appendLoadingCard(id) {
      const stream = document.getElementById('chatStream');
      const div = document.createElement('div');
      div.id = id;
      div.className = 'flex gap-3';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shrink-0 mt-1">
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        </div>
        <div class="flex-1 max-w-3xl bg-cine-card border border-cine-border p-6 rounded-2xl rounded-tl-sm text-sm space-y-4 shadow-xl">
          <div class="flex items-center justify-between text-xs font-mono">
            <span class="text-cyan-400 font-bold uppercase tracking-wider flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
              Rendering 5-Act Film (Holding until 100% ready)...
            </span>
            <span id="${id}-percent" class="text-zinc-400 font-bold">0%</span>
          </div>

          <div class="w-full bg-zinc-950 rounded-full h-2 overflow-hidden border border-zinc-800">
            <div id="${id}-bar" class="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full w-0 transition-all duration-300"></div>
          </div>

          <p id="${id}-status" class="text-xs text-zinc-400 font-mono">Initializing acts...</p>
        </div>
      `;
      stream.appendChild(div);
      lucide.createIcons();
      stream.scrollTop = stream.scrollHeight;
    }

    function build5ActScript(prompt) {
      const isElijah = prompt.toLowerCase().includes('elijah') || prompt.toLowerCase().includes('bataan');
      
      if (isElijah) {
        return {
          title: "Elijah: From Bataan to Stardom",
          acts: [
            {
              act: 1,
              time: "0:00 - 1:00",
              title: "The Voice of Bataan",
              narration: "In a coastal town in Bataan, young Elijah carries a dream of music.",
              prompt: "young Filipino boy Elijah singing in coastal Bataan Philippines, sunny morning, cinematic lighting, 35mm"
            },
            {
              act: 2,
              time: "1:00 - 2:00",
              title: "The Local Festival",
              narration: "At the town fiesta, his voice captivates the local audience.",
              prompt: "young Filipino male singer on colorful town fiesta stage in Philippines, festival lights, crowd, cinematic"
            },
            {
              act: 3,
              time: "2:00 - 3:00",
              title: "The Crucible of the City",
              narration: "In Manila, studio sessions test his focus and perseverance.",
              prompt: "Filipino male singer in professional Manila music recording studio, microphone, moody blue lighting"
            },
            {
              act: 4,
              time: "3:00 - 4:00",
              title: "National Breakthrough",
              narration: "A televised performance brings his music to a national stage.",
              prompt: "Filipino musical artist performing at big stadium concert arena, glowing stage lights, cinematic 8k"
            },
            {
              act: 5,
              time: "4:00 - 5:00",
              title: "Return to the Shores",
              narration: "Elijah returns to Bataan, giving back to where his journey began.",
              prompt: "successful Filipino male artist standing on scenic beach coast of Bataan Philippines, sunset ocean, cinematic"
            }
          ]
        };
      }

      return {
        title: prompt.length > 40 ? prompt.substring(0, 40) + '...' : prompt,
        acts: [
          { act: 1, time: "0:00 - 1:00", title: "Act I: Origins", narration: "The journey begins from humble foundations.", prompt: `${prompt}, wide shot, morning light, 35mm cinematic` },
          { act: 2, time: "1:00 - 2:00", title: "Act II: Momentum", narration: "Focus and speed build across uncharted territory.", prompt: `${prompt}, dynamic camera movement, atmospheric lighting, 8k` },
          { act: 3, time: "2:00 - 3:00", title: "Act III: Trial", narration: "The central trial pushes determination to the limit.", prompt: `${prompt}, dramatic close-up, high contrast chiaroscuro, cinematic` },
          { act: 4, time: "3:00 - 4:00", title: "Act IV: Peak", narration: "Barriers fall as momentum transforms into success.", prompt: `${prompt}, wide action view, golden hour rim lighting, IMAX` },
          { act: 5, time: "4:00 - 5:00", title: "Act V: Legacy", narration: "Standing at the finish, the vision is fully realized.", prompt: `${prompt}, panoramic sunset view, emotional cinematic masterpiece` }
        ]
      };
    }

    async function fetchAllSceneImagesGuaranteed(script, prodId) {
      const percentEl = document.getElementById(`${prodId}-percent`);
      const barEl = document.getElementById(`${prodId}-bar`);
      const statusEl = document.getElementById(`${prodId}-status`);

      const images = [];

      for (let i = 0; i < script.acts.length; i++) {
        const act = script.acts[i];
        statusEl.textContent = `Rendering Act ${act.act}: ${act.title}...`;

        const img = await loadVerifiedImage(act.prompt, i);
        images.push(img);

        const progress = Math.round(((i + 1) / script.acts.length) * 100);
        percentEl.textContent = `${progress}%`;
        barEl.style.width = `${progress}%`;
      }

      statusEl.textContent = "All 5 acts verified. Launching master player...";
      await new Promise(r => setTimeout(r, 600));

      return images;
    }

    function loadVerifiedImage(promptText, index) {
      return new Promise((resolve) => {
        let attempts = 0;

        function tryLoad() {
          attempts++;
          const img = new Image();
          img.crossOrigin = 'anonymous';

          const seed = 8100 + (index * 61) + attempts;
          const cleanPrompt = encodeURIComponent(promptText.slice(0, 150));
          const url = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=1280&height=720&model=turbo&nologo=true&seed=${seed}`;

          const timeout = setTimeout(() => {
            if (attempts < 3) tryLoad();
            else createFallbackCanvasImage(promptText, index, resolve);
          }, 7000);

          img.onload = () => {
            clearTimeout(timeout);
            if (img.naturalWidth > 0) resolve(img);
            else tryLoad();
          };

          img.onerror = () => {
            clearTimeout(timeout);
            if (attempts < 3) tryLoad();
            else createFallbackCanvasImage(promptText, index, resolve);
          };

          img.src = url;
        }

        tryLoad();
      });
    }

    // Creates a high-contrast cinematic rendered frame if the network drops an act
    function createFallbackCanvasImage(text, index, resolve) {
      const c = document.createElement('canvas');
      c.width = 1280;
      c.height = 720;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 1280, 720);
      grad.addColorStop(0, '#0a1120');
      grad.addColorStop(0.5, '#1e293b');
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1280, 720);

      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 24px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText(`ACT ${index + 1}: ${text.slice(0, 45)}...`, 640, 360);

      const fallbackImg = new Image();
      fallbackImg.onload = () => resolve(fallbackImg);
      fallbackImg.src = c.toDataURL('image/jpeg', 0.9);
    }

    /* ----------------------------------------------------
       300-SECOND CINEMA PLAYER & CAMERA ENGINE
    ---------------------------------------------------- */
    const ACTIVE_PLAYERS = {};

    function renderCinemaPlayer(prodId, script, images) {
      const container = document.getElementById(prodId);
      if (!container) return;

      const playerKey = 'pk-' + Date.now();

      container.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shrink-0 mt-1">
          <i data-lucide="check" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 max-w-4xl bg-cine-card border border-cine-border p-5 rounded-2xl rounded-tl-sm text-sm space-y-4 shadow-xl">
          
          <div class="flex items-center justify-between pb-3 border-b border-cine-border">
            <div>
              <h3 class="font-extrabold text-white text-base">${escapeHtml(script.title)}</h3>
              <p class="text-[11px] font-mono text-cyan-400">300-SECOND FULL CINEMATIC MASTER • ALL 5 ACTS VERIFIED</p>
            </div>
            <button onclick="downloadMasterClip('${playerKey}')" class="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-bold text-xs font-mono flex items-center gap-1.5 transition-all shadow-md shadow-cyan-500/20">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>Download Video Clip</span>
            </button>
          </div>

          <div class="relative aspect-video w-full bg-black rounded-xl overflow-hidden border border-zinc-800 shadow-2xl">
            <canvas id="${playerKey}-canvas" width="1280" height="720" class="w-full h-full object-cover"></canvas>
            
            <div class="absolute inset-0 p-4 pointer-events-none flex flex-col justify-between text-xs font-mono">
              <div class="flex justify-between items-start">
                <span class="bg-black/75 px-2.5 py-1 rounded text-cyan-300 backdrop-blur border border-white/5 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                  KADA 300s ACTIVE RENDER
                </span>
                <span class="bg-black/75 px-2.5 py-1 rounded text-amber-300 backdrop-blur border border-white/5 font-bold" id="${playerKey}-timecode">00:00 / 05:00</span>
              </div>
              <div class="bg-black/85 p-3 rounded-lg max-w-2xl backdrop-blur border border-white/10 space-y-1">
                <div class="text-[10px] text-cyan-400 font-bold tracking-wider uppercase" id="${playerKey}-actTag">ACT 1: ${script.acts[0].title.toUpperCase()} [0:00 - 1:00]</div>
                <div class="text-xs text-zinc-100 italic leading-relaxed" id="${playerKey}-narration">"${script.acts[0].narration}"</div>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between gap-3 bg-cine-surface p-3 rounded-xl border border-cine-border">
            <div class="flex items-center gap-2.5">
              <button onclick="togglePlayback('${playerKey}')" id="${playerKey}-playBtn" class="w-9 h-9 rounded-full bg-cyan-500 hover:bg-cyan-400 text-zinc-950 flex items-center justify-center font-bold shadow-md shadow-cyan-500/30">
                <i data-lucide="play" class="w-4 h-4 ml-0.5" id="${playerKey}-playIcon"></i>
              </button>
              <div class="font-mono text-xs text-zinc-300">
                <span id="${playerKey}-currTime" class="text-cyan-400 font-bold">00:00</span> / 05:00
              </div>
            </div>

            <input type="range" id="${playerKey}-slider" min="0" max="300" step="1" value="0" oninput="seekTo('${playerKey}', this.value)" class="flex-1 accent-cyan-400 cursor-pointer">

            <div class="flex gap-1 text-[10px] font-mono">
              <button onclick="seekTo('${playerKey}', 0)" class="px-2 py-1 rounded bg-zinc-900 text-zinc-300 hover:bg-zinc-800">Act 1</button>
              <button onclick="seekTo('${playerKey}', 60)" class="px-2 py-1 rounded bg-zinc-900 text-zinc-300 hover:bg-zinc-800">Act 2</button>
              <button onclick="seekTo('${playerKey}', 120)" class="px-2 py-1 rounded bg-zinc-900 text-zinc-300 hover:bg-zinc-800">Act 3</button>
              <button onclick="seekTo('${playerKey}', 180)" class="px-2 py-1 rounded bg-zinc-900 text-zinc-300 hover:bg-zinc-800">Act 4</button>
              <button onclick="seekTo('${playerKey}', 240)" class="px-2 py-1 rounded bg-zinc-900 text-zinc-300 hover:bg-zinc-800">Act 5</button>
            </div>
          </div>

          <!-- Verified 5-Act Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-5 gap-2 pt-1">
            ${script.acts.map((act, idx) => `
              <div class="p-2.5 rounded-lg bg-cine-surface border border-cine-border text-[11px] space-y-1.5 cursor-pointer hover:border-cyan-400 transition-all" onclick="seekTo('${playerKey}',${idx * 60})">
                <div class="flex items-center justify-between font-mono text-[9px] text-cyan-300 font-bold">
                  <span>ACT ${act.act}</span>
                  <span class="text-zinc-500">${act.time}</span>
                </div>
                <div class="font-semibold text-white truncate">${escapeHtml(act.title)}</div>
                <div class="h-16 w-full bg-zinc-950 rounded overflow-hidden relative border border-zinc-800/80">
                  <img src="${images[idx].src}" class="w-full h-full object-cover">
                </div>
              </div>
            `).join('')}
          </div>

        </div>
      `;

      lucide.createIcons();

      const cvs = document.getElementById(`${playerKey}-canvas`);
      ACTIVE_PLAYERS[playerKey] = {
        canvas: cvs,
        ctx: cvs.getContext('2d'),
        script: script,
        images: images,
        currentTime: 0,
        isPlaying: false,
        totalDuration: 300,
        audioCtx: null,
        osc: null
      };

      renderActFrame(ACTIVE_PLAYERS[playerKey], performance.now());
    }

    function renderActFrame(player, timestamp) {
      const { ctx, canvas, currentTime, images } = player;
      const w = canvas.width;
      const h = canvas.height;

      const actIdx = Math.min(4, Math.floor(currentTime / 60));
      const activeImg = images[actIdx];

      ctx.save();
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      if (activeImg && activeImg.complete && activeImg.naturalWidth > 0) {
        const progress = (currentTime % 60) / 60;
        
        let zoom = 1.05 + (progress * 0.12);
        let panX = 0;
        let panY = 0;

        if (actIdx === 0) {
          zoom = 1.0 + (progress * 0.14);
          panY = Math.sin(progress * Math.PI) * 12;
        } else if (actIdx === 1) {
          zoom = 1.08;
          panX = (0.5 - progress) * 35;
        } else if (actIdx === 2) {
          zoom = 1.12 + Math.sin(progress * 3) * 0.02;
          panX = Math.sin(timestamp * 0.002) * 3;
        } else if (actIdx === 3) {
          zoom = 1.04 + (progress * 0.16);
          panX = Math.sin(progress * Math.PI) * -30;
        } else {
          zoom = 1.22 - (progress * 0.14);
          panY = (progress - 0.5) * 20;
        }

        ctx.translate(w / 2 + panX, h / 2 + panY);
        ctx.scale(zoom, zoom);
        ctx.drawImage(activeImg, -w / 2, -h / 2, w, h);
        ctx.restore();

        // 35mm grain pass
        ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
        for (let g = 0; g < 150; g++) {
          ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
        }

        // Anamorphic flare streak
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const flareY = h * 0.48;
        const grad = ctx.createLinearGradient(0, flareY, w, flareY);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.5, 'rgba(0, 229, 255, 0.35)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, flareY - 1, w, 2);
        ctx.restore();

        // Lens vignette
        const vig = ctx.createRadialGradient(w/2, h/2, w*0.4, w/2, h/2, w*0.75);
        vig.addColorStop(0, 'transparent');
        vig.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, w, h);
      } else {
        ctx.restore();
      }
    }

    function togglePlayback(key) {
      const player = ACTIVE_PLAYERS[key];
      if (!player) return;

      player.isPlaying = !player.isPlaying;
      const icon = document.getElementById(`${key}-playIcon`);

      if (player.isPlaying) {
        icon.setAttribute('data-lucide', 'pause');
        startAudioSynth(player);
        startPlayLoop(key, player);
        speakVoiceover(player);
      } else {
        icon.setAttribute('data-lucide', 'play');
        stopAudioSynth(player);
      }
      lucide.createIcons();
    }

    function startPlayLoop(key, player) {
      let lastTime = performance.now();

      function step(now) {
        if (!player.isPlaying) return;
        const delta = (now - lastTime) / 1000;
        lastTime = now;

        player.currentTime = (player.currentTime + delta) % player.totalDuration;
        updatePlayerUI(key, player);
        renderActFrame(player, now);

        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function seekTo(key, seconds) {
      const player = ACTIVE_PLAYERS[key];
      if (!player) return;
      player.currentTime = parseFloat(seconds);
      updatePlayerUI(key, player);
      renderActFrame(player, performance.now());
      if (player.isPlaying) speakVoiceover(player);
    }

    function updatePlayerUI(key, player) {
      const slider = document.getElementById(`${key}-slider`);
      const currSpan = document.getElementById(`${key}-currTime`);
      const timecode = document.getElementById(`${key}-timecode`);
      const actTag = document.getElementById(`${key}-actTag`);
      const narration = document.getElementById(`${key}-narration`);

      slider.value = player.currentTime;
      const mins = Math.floor(player.currentTime / 60);
      const secs = Math.floor(player.currentTime % 60);
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      currSpan.textContent = timeStr;
      timecode.textContent = `${timeStr} / 05:00`;

      const actIdx = Math.min(4, Math.floor(player.currentTime / 60));
      const act = player.script.acts[actIdx];
      actTag.textContent = `ACT ${act.act}: ${act.title.toUpperCase()} [${act.time}]`;
      narration.textContent = `"${act.narration}"`;
    }

    function startAudioSynth(player) {
      if (!player.audioCtx) {
        player.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const osc = player.audioCtx.createOscillator();
      const gain = player.audioCtx.createGain();
      const filter = player.audioCtx.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(55, player.audioCtx.currentTime);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(180, player.audioCtx.currentTime);

      gain.gain.setValueAtTime(0.18, player.audioCtx.currentTime);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(player.audioCtx.destination);
      osc.start();
      player.osc = osc;
    }

    function stopAudioSynth(player) {
      if (player.osc) {
        try { player.osc.stop(); } catch(e){}
        player.osc = null;
      }
    }

    function speakVoiceover(player) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const actIdx = Math.min(4, Math.floor(player.currentTime / 60));
      const utter = new SpeechSynthesisUtterance(player.script.acts[actIdx].narration);
      utter.rate = 0.92;
      utter.pitch = 0.85;
      window.speechSynthesis.speak(utter);
    }

    function downloadMasterClip(key) {
      const player = ACTIVE_PLAYERS[key];
      if (!player) return;

      const stream = player.canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `KADA_300s_Cinema_Clip_${Date.now()}.webm`;
        a.click();
      };

      recorder.start();
      alert("Recording continuous cinema video clip...\nYour browser will automatically download the file shortly!");
      setTimeout(() => recorder.stop(), 5000);
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }
  </script>
</body>
